name: iOS personal validation

on:
  workflow_dispatch:
  push:
    branches: [feat/ios-personal-validation]
    paths:
      - .github/workflows/ios-personal.yml
      - native/ios-probe/**
      - app.config.js
      - src/**
      - native/quick-access/**
      - plugins/withQuickAccess.js
      - scripts/**
      - integrations/**

permissions:
  contents: read

concurrency:
  group: ios-personal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check xtool signing identity staging
        run: python3 scripts/test-prepare-xtool-ipa.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native validation project
        working-directory: native/ios-probe
        run: xcodegen generate
      - name: Build unsigned app with WidgetKit and App Intents
        run: >-
          xcodebuild -project native/ios-probe/AbacusProbe.xcodeproj
          -scheme AbacusProbe -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build/probe CODE_SIGNING_ALLOWED=NO
          CURRENT_PROJECT_VERSION=${{ github.run_number }} build
      - name: Package for local signing
        run: |
          mkdir -p build/package/Payload
          cp -R build/probe/Build/Products/Release-iphoneos/AbacusProbe.app build/package/Payload/
          cd build/package
          zip -qr ../abacus-probe-unsigned.ipa Payload
      - name: Verify embedded widget and App Intents metadata
        run: python3 scripts/verify-ios-probe.py build/abacus-probe-unsigned.ipa
      - name: Check native integration before compiling React Native
        run: |
          xcodegen generate --spec native/quick-access/check.yml --project native/quick-access
          xcodebuild -project native/quick-access/AbacusNativeCheck.xcodeproj -scheme AbacusNativeCheck -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/native-check CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: abacus-probe-unsigned
          path: build/abacus-probe-unsigned.ipa
          retention-days: 7
  abacus:
    needs: probe
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_VARIANT: personal
      PERSONAL_IOS_BUILD_NUMBER: ${{ github.run_number }}
      PERSONAL_APP_IDENTIFIER: XTL-8X6B8DVC3S.com.cristiant2608.abacus.personal
      CI: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:quick-access
      - name: Verify standalone financial widgets
        run: |
          node scripts/generate-scriptable-widget.cjs --check
          node scripts/test-scriptable-widget.cjs
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Generate isolated personal app
        run: npx expo prebuild --platform ios --no-install
      - name: Install native dependencies
        working-directory: ios
        run: pod install
      - name: Compile unsigned Abacus
        run: >-
          xcodebuild -workspace ios/AbacusPersonal.xcworkspace
          -scheme AbacusPersonal -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build/abacus CODE_SIGNING_ALLOWED=NO build
      - name: Package for local signing
        run: |
          mkdir -p build/abacus-package/Payload
          cp -R build/abacus/Build/Products/Release-iphoneos/AbacusPersonal.app build/abacus-package/Payload/
          cd build/abacus-package
          zip -qr ../abacus-personal-unsigned.ipa Payload
      - name: Verify personal app and extension
        run: >-
          python3 scripts/verify-ios-probe.py build/abacus-personal-unsigned.ipa
          --app-id "$PERSONAL_APP_IDENTIFIER"
          --widget-id "$PERSONAL_APP_IDENTIFIER.quickaccess"
          --scheme abacus-personal
      - uses: actions/upload-artifact@v4
        with:
          name: abacus-personal-unsigned
          path: build/abacus-personal-unsigned.ipa
          retention-days: 7
