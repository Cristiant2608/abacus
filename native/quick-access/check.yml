name: AbacusNativeCheck
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '1.0'
targets:
  AbacusNativeCheck:
    type: application
    platform: iOS
    sources:
      - ../ios-probe/App
      - AbacusQuickAccess.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cristiant2608.abacus.nativecheck
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: AbacusNativeCheckWidget
        embed: true
  AbacusNativeCheckWidget:
    type: app-extension
    platform: iOS
    sources: [ExpenseWidget.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cristiant2608.abacus.nativecheck.widget
        SKIP_INSTALL: YES
    info:
      path: Generated/Widget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
